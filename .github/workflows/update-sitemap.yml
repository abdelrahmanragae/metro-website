name: Update project sitemap
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_sitemap.py'
      - 'admin/config.js'
permissions:
  contents: write
jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate sitemap from published projects
        run: python scripts/generate_sitemap.py
      - name: Commit sitemap if changed
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "SEO: refresh published project sitemap"
            git push
          fi
