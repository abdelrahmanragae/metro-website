<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Metro — Studio Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
:root{font-family:'DM Sans',Arial,sans-serif;color:#191919;background:#f7f7f4}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit}aside{position:fixed;inset:0 auto 0 0;width:240px;background:#171717;color:white;padding:30px 18px;display:flex;flex-direction:column;gap:26px}.brand{font-size:27px;font-weight:700;letter-spacing:-1.4px;padding:0 14px}.brand small{display:block;font-size:10px;font-weight:500;letter-spacing:2px;color:#999;margin-top:5px}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;background:none;color:#aaa;padding:13px 14px;border-radius:9px}.nav button.active,.nav button:hover{background:#333;color:white}.asidefoot{margin-top:auto;font-size:12px;color:#aaa;padding:12px}.asidefoot button{margin-top:12px;color:white;background:none;border:1px solid #666;padding:9px 12px;border-radius:7px}main{margin-left:240px;padding:45px max(32px,5vw);max-width:1600px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}h1{font-size:33px;letter-spacing:-1.3px;margin:0 0 7px}h2{font-size:21px;letter-spacing:-.5px}p.muted,.muted{color:#777;font-size:13px;margin:0}.btn{border:1px solid #d5d5d0;background:white;color:#222;padding:10px 15px;border-radius:8px;font-weight:600;font-size:13px}.btn.primary{background:#191919;color:white;border-color:#191919}.btn.danger{color:#ae3434}.panel{background:white;border:1px solid #e5e5df;border-radius:12px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.metric{font-size:32px;font-weight:600;margin-top:13px}.table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;font-weight:600}th,td{padding:15px 10px;border-bottom:1px solid #ededeb}td{font-size:13px}.actions{display:flex;gap:7px;justify-content:flex-end}.actions .btn{padding:7px 10px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #deded9;border-radius:8px;padding:12px;background:white}.field textarea{min-height:100px;resize:vertical}.editor{max-width:900px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.block{padding:15px;border:1px solid #e1e1dc;border-radius:9px;margin-bottom:10px}.blockhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.pill{display:inline-block;padding:5px 8px;border-radius:30px;background:#f1f1ed;color:#666;font-size:11px}.notice{padding:14px 17px;background:#f0eee7;border:1px solid #dedbd0;border-radius:9px;color:#625b4e;font-size:13px;margin-bottom:25px}.empty{padding:45px;text-align:center;color:#777}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .panel{width:min(420px,100%)}.login h1{margin-bottom:12px}.error{color:#b43131;font-size:13px}.check{width:18px;height:18px;accent-color:#222}.hidden{display:none!important}.stack{display:grid;gap:12px}.preview{max-width:100%;max-height:160px;object-fit:cover;border-radius:7px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.message{padding:18px;border-bottom:1px solid #eee;cursor:pointer}.message:hover{background:#fafaf8}@media(max-width:850px){aside{position:static;width:auto;padding:15px}.brand{font-size:22px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.asidefoot{display:none}main{margin:0;padding:24px 15px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{overflow:auto}.top{align-items:flex-start}}
</style></head><body>
<div id="login" class="login"><div class="panel"><div class="brand" style="padding:0;color:#191919">metro<small>STUDIO ADMIN</small></div><h1 style="margin-top:35px">Welcome back.</h1><p class="muted" style="margin-bottom:22px">Sign in with your studio account.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Sign in</button><p id="loginError" class="error"></p></form><p class="muted" style="margin-top:22px">Authentication is unavailable until Supabase is configured.</p></div></div>
<div id="app" class="hidden"><aside><div class="brand">metro<small>STUDIO ADMIN</small></div><div class="nav" id="nav"></div><div class="asidefoot"><span id="userEmail"></span><br><button id="signOut">Sign out</button></div></aside><main><div id="view"></div></main></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const config=window.METRO_CONFIG||{};
const ready=!!(config.url&&config.anonKey&&window.supabase);
const sb=ready?window.supabase.createClient(config.url,config.anonKey):null;
const tabs=['Overview','Projects','Team','Pages','Contact & Social','Inbox'];
const $=s=>document.querySelector(s);
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='Overview',edit=null,records=[],blocks=[];
const button=(label,fn,cls='')=>'<button class="btn '+cls+'" data-act="'+fn+'">'+label+'</button>';
function title(name,desc,extra=''){return '<div class="top"><div><h1>'+escapeHTML(name)+'</h1><p class="muted">'+escapeHTML(desc)+'</p></div>'+extra+'</div>'}
function field(name,value='',type='text'){return '<div class="field"><label>'+escapeHTML(name)+'</label>'+(type==='textarea'?'<textarea data-field="'+escapeHTML(name)+'">'+escapeHTML(value)+'</textarea>':'<input data-field="'+escapeHTML(name)+'" type="'+type+'" value="'+escapeHTML(value)+'">')+'</div>'}
function formValue(name){return document.querySelector('[data-field="'+name+'"]')?.value||''}
function notice(msg){return '<div class="notice">'+escapeHTML(msg)+'</div>'}
function renderNav(){ $('#nav').innerHTML=tabs.map(t=>'<button class="'+(current===t?'active':'')+'" data-tab="'+t+'">'+t+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab))}
async function load(table){const {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false});if(error)throw error;return data||[]}
async function save(table,payload,id){let q=id?sb.from(table).update(payload).eq('id',id):sb.from(table).insert(payload);const {error}=await q;if(error)throw error}
async function remove(table,id){if(!confirm('Delete this item permanently?'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)alert(error.message);else show(current)}
async function show(tab){current=tab;edit=null;renderNav();const v=$('#view');v.innerHTML=title(tab,'Loading…');try{if(tab==='Overview'){const [p,t,m]=await Promise.all(['projects','team_members','messages'].map(load));v.innerHTML=title('Studio Overview','Your website, all in one place.')+notice('The live website will use this content after its public data integration is enabled.')+'<div class="grid">'+[['Projects',p.length],['Team Members',t.length],['Messages',m.length]].map(x=>'<div class="panel"><span class="muted">'+x[0]+'</span><div class="metric">'+x[1]+'</div></div>').join('')+'</div>'}
else if(tab==='Projects')await listProjects();
else if(tab==='Team')await listTeam();
else if(tab==='Pages')await listPages();
else if(tab==='Contact & Social')await listContacts();
else if(tab==='Inbox')await listInbox();
}catch(e){v.innerHTML=title(tab,'Could not load content')+notice(e.message)}}
async function listProjects(){records=await load('projects');$('#view').innerHTML=title('Projects','Manage your portfolio and homepage capsules.',button('+ Add Project','newProject','primary'))+'<div class="panel"><table class="table"><thead><tr><th>Project</th><th>Published</th><th>Homepage</th><th style="text-align:right">Actions</th></tr></thead><tbody>'+records.map((p,i)=>'<tr><td><strong>'+escapeHTML(p.name)+'</strong><br><span class="muted">'+escapeHTML(p.slug)+'</span></td><td><input class="check" type="checkbox" data-toggle="published" data-i="'+i+'" '+(p.published?'checked':'')+'></td><td><input class="check" type="checkbox" data-toggle="on_homepage" data-i="'+i+'" '+(p.on_homepage?'checked':'')+'></td><td><div class="actions">'+button('Edit','project:'+i)+button('Delete','deleteProject:'+i,'danger')+'</div></td></tr>').join('')+'</tbody></table>'+(records.length?'':'<div class="empty">No projects yet. Add your first project.</div>')+'</div>';bind()}
function projectEditor(i){edit=i===null?null:records[i];blocks=structuredClone(edit?.blocks||[]);const p=edit||{};$('#view').innerHTML=title(edit?'Edit Project':'New Project','Build the project story using flexible content blocks.',button('← Projects','backProjects'))+notice('Cover accepts an uploaded image, GIF or video. Content blocks can be reordered and displayed full or half width.')+'<div class="editor"><div class="panel">'+field('Project Name',p.name)+field('Slug',p.slug)+field('Description',p.description,'textarea')+field('Cover URL',p.cover_url)+field('Cover Type',p.cover_type||'image')+'<div class="row"><input id="published" type="checkbox" '+(p.published?'checked':'')+'> Published <input id="homepage" type="checkbox" '+(p.on_homepage?'checked':'')+'> Show on homepage</div><br><div class="field"><label>Upload cover or media</label><input type="file" id="mediaFile" accept="image/*,video/*"><button class="btn" id="uploadMedia">Upload to storage & use as cover</button></div></div><div class="panel"><h2>Content Builder</h2><div id="blocks"></div><div class="row"><select id="blockType" class="btn"><option value="image">Image</option><option value="video">Video</option><option value="text">Text</option><option value="gallery">Gallery</option></select>'+button('+ Add Block','addBlock')+'</div></div><div class="row">'+button('Save Project','saveProject','primary')+button('Cancel','backProjects')+'</div></div>';renderBlocks();bind();$('#uploadMedia').onclick=async e=>{e.preventDefault();try{const file=$('#mediaFile').files[0];if(!file)throw Error('Select a file first');const url=await upload(file);document.querySelector('[data-field="Cover URL"]').value=url;document.querySelector('[data-field="Cover Type"]').value=file.type.startsWith('video/')?'video':'image';alert('Uploaded successfully')}catch(err){alert(err.message)}}}
function renderBlocks(){const target=$('#blocks');if(!target)return;target.innerHTML=blocks.map((b,i)=>'<div class="block"><div class="blockhead"><strong>'+escapeHTML(b.type.toUpperCase())+' · '+(i+1)+'</strong><div class="row">'+button('↑','up:'+i)+button('↓','down:'+i)+button('Remove','removeBlock:'+i,'danger')+'</div></div><div class="field"><label>Content '+(b.type==='gallery'?'(image URLs separated by new lines)':b.type==='text'?'':'URL')+'</label><textarea data-block="'+i+'">'+escapeHTML(b.content||'')+'</textarea></div><div class="field"><label>Layout</label><select data-layout="'+i+'"><option value="full" '+(b.width==='full'?'selected':'')+'>Full width</option><option value="half" '+(b.width==='half'?'selected':'')+'>Half width</option></select></div></div>').join('');bind()}
function syncBlocks(){document.querySelectorAll('[data-block]').forEach(x=>blocks[+x.dataset.block].content=x.value);document.querySelectorAll('[data-layout]').forEach(x=>blocks[+x.dataset.layout].width=x.value)}
async function upload(file){const path=crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await sb.storage.from('media').upload(path,file,{upsert:false});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}
async function listTeam(){records=await load('team_members');$('#view').innerHTML=title('Team','People featured on About Metro.',button('+ Add Member','newMember','primary'))+'<div class="panel"><table class="table"><thead><tr><th>Member</th><th>Job Title</th><th>Visible</th><th>Actions</th></tr></thead><tbody>'+records.map((m,i)=>'<tr><td>'+escapeHTML(m.name)+'</td><td>'+escapeHTML(m.job_title)+'</td><td><input type="checkbox" class="check" data-toggle="visible" data-i="'+i+'" '+(m.visible?'checked':'')+'></td><td><div class="actions">'+button('Edit','member:'+i)+button('Delete','deleteMember:'+i,'danger')+'</div></td></tr>').join('')+'</tbody></table></div>';bind()}
function memberEditor(i){edit=i===null?null:records[i];const m=edit||{};$('#view').innerHTML=title(edit?'Edit Member':'Add Member','Photo, name and job title.',button('← Team','backTeam'))+'<div class="editor panel">'+field('Full Name',m.name)+field('Job Title',m.job_title)+field('Photo URL',m.photo_url)+'<div class="field"><label>Upload photo</label><input type="file" id="mediaFile" accept="image/*">'+button('Upload Photo','uploadPhoto')+'</div><label><input type="checkbox" id="visible" '+(m.visible!==false?'checked':'')+'> Show on website</label><br><br>'+button('Save Member','saveMember','primary')+'</div>';bind()}
async function listPages(){records=await load('pages');$('#view').innerHTML=title('Pages','Edit About Metro and Start a Journey.')+'<div class="stack">'+records.map((p,i)=>'<div class="panel row"><div><strong>'+escapeHTML(p.title)+'</strong><p class="muted">/'+escapeHTML(p.slug)+'</p></div><span class="spacer"></span>'+button('Edit Page','page:'+i)+'</div>').join('')+'</div>';bind()}
function pageEditor(i){edit=records[i];blocks=structuredClone(edit.sections||[]);$('#view').innerHTML=title('Edit '+edit.title,'Add, edit and reorder page sections.',button('← Pages','backPages'))+'<div class="editor"><div class="panel">'+field('Page Title',edit.title)+field('Intro',edit.intro,'textarea')+'</div><div class="panel"><h2>Sections</h2><div id="blocks"></div><div class="row"><select id="blockType" class="btn"><option value="heading">Heading</option><option value="text">Text</option><option value="image">Image</option><option value="video">Video</option><option value="image-text">Image + Text</option><option value="gallery">Gallery</option><option value="team">Team</option><option value="contact-form">Contact Form</option><option value="contact-links">Contact Links</option></select>'+button('+ Add Section','addBlock')+'</div></div>'+button('Save Page','savePage','primary')+'</div>';renderBlocks();bind()}
async function listContacts(){records=await load('contact_links');$('#view').innerHTML=title('Contact & Social Links','Update links once and reuse them across the website.',button('+ Add Link','newContact','primary'))+'<div class="panel"><table class="table"><thead><tr><th>Label</th><th>Value</th><th>Visible</th><th>Actions</th></tr></thead><tbody>'+records.map((c,i)=>'<tr><td>'+escapeHTML(c.label)+'</td><td>'+escapeHTML(c.value)+'</td><td><input type="checkbox" class="check" data-toggle="visible" data-i="'+i+'" '+(c.visible?'checked':'')+'></td><td><div class="actions">'+button('Edit','contact:'+i)+button('Delete','deleteContact:'+i,'danger')+'</div></td></tr>').join('')+'</tbody></table></div>';bind()}
function contactEditor(i){edit=i===null?null:records[i];const c=edit||{};$('#view').innerHTML=title(edit?'Edit Contact':'Add Contact','Control contact details and external links.',button('← Contacts','backContacts'))+'<div class="editor panel">'+field('Label',c.label)+field('Value',c.value)+field('URL',c.url)+'<label><input type="checkbox" id="visible" '+(c.visible!==false?'checked':'')+'> Visible</label><br><br>'+button('Save Contact','saveContact','primary')+'</div>';bind()}
async function listInbox(){records=await load('messages');$('#view').innerHTML=title('Inbox','Messages sent from the website.')+'<div class="panel">'+(records.length?records.map((m,i)=>'<div class="message" data-act="message:'+i+'"><strong>'+escapeHTML(m.name)+'</strong> · '+escapeHTML(m.email)+' '+(m.is_read?'':'<span class="pill">New</span>')+'<p class="muted">'+escapeHTML((m.message||'').slice(0,130))+'</p></div>').join(''):'<div class="empty">No messages yet.</div>')+'</div>';bind()}
async function messageEditor(i){const m=records[i];await save('messages',{is_read:true},m.id);$('#view').innerHTML=title('Message from '+m.name,escapeHTML(m.email),button('← Inbox','backInbox'))+'<div class="editor panel"><p>'+escapeHTML(m.message).replace(/\n/g,'<br>')+'</p><div class="row"><a class="btn primary" href="mailto:'+encodeURIComponent(m.email)+'?subject='+encodeURIComponent('Re: Your message to Metro')+'">Reply by email</a>'+button('Delete','deleteMessage:'+i,'danger')+'</div></div>';bind()}
function bind(){document.querySelectorAll('[data-act]').forEach(el=>el.onclick=async()=>{const [action,arg]=el.dataset.act.split(':');try{if(action==='newProject')projectEditor(null);else if(action==='project')projectEditor(+arg);else if(action==='backProjects')show('Projects');else if(action==='deleteProject')remove('projects',records[+arg].id);else if(action==='saveProject'){syncBlocks();const name=formValue('Project Name');if(!name.trim())throw Error('Project name is required');const slug=formValue('Slug')||name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');await save('projects',{name,slug,description:formValue('Description'),cover_url:formValue('Cover URL'),cover_type:formValue('Cover Type'),published:$('#published').checked,on_homepage:$('#homepage').checked,blocks},edit?.id);show('Projects')}
else if(action==='addBlock'){syncBlocks();blocks.push({type:$('#blockType').value,content:'',width:'full'});renderBlocks()}
else if(action==='up'||action==='down'){syncBlocks();const i=+arg,j=i+(action==='up'?-1:1);if(j>=0&&j<blocks.length)[blocks[i],blocks[j]]=[blocks[j],blocks[i]];renderBlocks()}
else if(action==='removeBlock'){syncBlocks();blocks.splice(+arg,1);renderBlocks()}
else if(action==='newMember')memberEditor(null);else if(action==='member')memberEditor(+arg);else if(action==='backTeam')show('Team');else if(action==='deleteMember')remove('team_members',records[+arg].id);else if(action==='uploadPhoto'){const f=$('#mediaFile').files[0];if(!f)throw Error('Select a photo');document.querySelector('[data-field="Photo URL"]').value=await upload(f);alert('Photo uploaded')}
else if(action==='saveMember'){await save('team_members',{name:formValue('Full Name'),job_title:formValue('Job Title'),photo_url:formValue('Photo URL'),visible:$('#visible').checked},edit?.id);show('Team')}
else if(action==='page')pageEditor(+arg);else if(action==='backPages')show('Pages');else if(action==='savePage'){syncBlocks();await save('pages',{title:formValue('Page Title'),intro:formValue('Intro'),sections:blocks},edit.id);show('Pages')}
else if(action==='newContact')contactEditor(null);else if(action==='contact')contactEditor(+arg);else if(action==='backContacts')show('Contact & Social');else if(action==='deleteContact')remove('contact_links',records[+arg].id);else if(action==='saveContact'){await save('contact_links',{label:formValue('Label'),value:formValue('Value'),url:formValue('URL'),visible:$('#visible').checked},edit?.id);show('Contact & Social')}
else if(action==='message')messageEditor(+arg);else if(action==='backInbox')show('Inbox');else if(action==='deleteMessage')remove('messages',records[+arg].id)
}catch(e){alert(e.message)}});document.querySelectorAll('[data-toggle]').forEach(el=>el.onchange=async()=>{const table=current==='Projects'?'projects':current==='Team'?'team_members':'contact_links';const rec=records[+el.dataset.i];try{await save(table,{[el.dataset.toggle]:el.checked},rec.id);if(table==='projects'&&el.dataset.toggle==='published'&&!el.checked){await save(table,{on_homepage:false},rec.id)}show(current)}catch(e){alert(e.message);el.checked=!el.checked}})}
$('#loginForm').onsubmit=async e=>{e.preventDefault();if(!sb){$('#loginError').textContent='Supabase has not been configured yet.';return}const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){$('#loginError').textContent=error.message;return}boot()};
$('#signOut').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function boot(){if(!sb)return;const {data:{session}}=await sb.auth.getSession();$('#login').classList.toggle('hidden',!!session);$('#app').classList.toggle('hidden',!session);if(session){$('#userEmail').textContent=session.user.email;show('Overview')}}
if(sb){sb.auth.onAuthStateChange(()=>setTimeout(boot,0));boot()}
</script>
</body></html>
