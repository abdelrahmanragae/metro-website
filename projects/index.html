<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project | Metro Design Studio</title><meta name="robots" content="index,follow">
<meta name="description" content="Brand identity and creative work by Metro Design Studio.">
<link rel="stylesheet" href="../src/styles/main.css?v=metro-project-route-1">
<style>
html,body{height:auto;min-height:100%;overflow:auto}body{background:#fafaf8;color:#111}main{padding:90px clamp(20px,4.4vw,80px) 100px;max-width:1900px;margin:auto}
.back{position:absolute;right:clamp(20px,4.4vw,80px);top:28px;border:1px solid #111;border-radius:99px;padding:12px 22px;color:#111;text-decoration:none;background:#fafaf8;font-size:17px}
h1{font-size:clamp(48px,7vw,112px);letter-spacing:normal;line-height:1.05;margin:28px 0 28px;font-weight:700}
.desc{font-size:clamp(16px,1.35vw,23px);line-height:1.55;max-width:650px;margin:0 0 48px;white-space:pre-line}
.hero{width:100%;overflow:hidden;border-radius:20px;background:transparent}.hero img,.hero video{width:100%;height:auto;display:block;object-fit:contain}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}.block{min-width:0;overflow:hidden;border-radius:20px}.block.full{grid-column:1/-1}.block img,.block video{display:block;width:100%;height:auto}.block.text{font-size:clamp(17px,2vw,30px);line-height:1.45;white-space:pre-wrap;overflow:visible}.block.heading{font-size:clamp(25px,3.2vw,48px);font-weight:700;overflow:visible}
.more{margin-top:100px}.more h2{font-size:clamp(28px,3vw,50px);margin:0 0 30px}.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.more-card{display:block;color:inherit;text-decoration:none}.more-card img,.more-card video{display:block;width:100%;height:auto;aspect-ratio:1.5;object-fit:contain;background:#eee;border-radius:20px}.more-card strong{display:block;font-size:25px;margin-top:14px}
#status{font-size:20px}
@media(max-width:700px){main{padding:130px 20px 70px}.back{top:24px;font-size:15px;padding:10px 17px}h1{margin-top:0}.hero,.block,.more-card img,.more-card video{border-radius:9px}.blocks,.more-grid{grid-template-columns:1fr;gap:12px}.block{grid-column:1/-1!important}.desc{margin-bottom:35px}.more{margin-top:70px}}
</style></head><body>
<a class="back" href="../">← Back to Metro</a>
<main><h1 id="name">Project</h1><p class="desc" id="description"></p><p id="status">Loading project…</p><div class="hero" id="hero"></div><div class="blocks" id="blocks"></div><section class="more" id="more" hidden><h2>Explore More Projects</h2><div class="more-grid" id="moreGrid"></div></section></main>
<script src="../admin/config.js"></script><script>
(async()=>{
const slug=new URLSearchParams(location.search).get('slug'),config=window.METRO_CONFIG||{},status=document.getElementById('status');
if(!slug||!config.url||!config.anonKey){status.textContent='Project unavailable.';return}
const safe=(v)=>String(v||'').trim();
const media=(url,type,alt)=>{const el=document.createElement(type==='video'?'video':'img');el.src=url;if(type==='video'){el.autoplay=true;el.muted=true;el.defaultMuted=true;el.playsInline=true;el.loop=true;el.controls=true;el.setAttribute('playsinline','');el.play().catch(()=>{})}else{el.alt=alt;el.loading='lazy'}return el};
try{
const res=await fetch(config.url+'/rest/v1/projects?select=id,name,slug,description,cover_url,cover_type,blocks,published&published=eq.true&slug=eq.'+encodeURIComponent(slug)+'&limit=1',{headers:{apikey:config.anonKey}});
if(!res.ok)throw new Error('Request failed');
const data=await res.json(),p=data[0];if(!p){status.textContent='This project is not published or does not exist.';return}
status.remove();document.getElementById('name').textContent=p.name;document.getElementById('description').textContent=p.description||'';
document.title=p.name+' | Metro Design Studio';
const desc=document.querySelector('meta[name=description]');desc.content=safe(p.description).slice(0,160)||p.name+' — Metro Design Studio';
const canonical=document.createElement('link');canonical.rel='canonical';canonical.href=location.origin+'/projects/?slug='+encodeURIComponent(p.slug);document.head.appendChild(canonical);
for(const [property,content] of Object.entries({'og:type':'article','og:title':document.title,'og:description':desc.content,'og:url':canonical.href,...(p.cover_type!=='video'&&p.cover_url?{'og:image':p.cover_url}:{})})){const m=document.createElement('meta');m.setAttribute('property',property);m.content=content;document.head.appendChild(m)}
const hero=document.getElementById('hero');if(p.cover_url)hero.appendChild(media(p.cover_url,p.cover_type,p.name+' cover'));
const blocks=document.getElementById('blocks');
for(const b of Array.isArray(p.blocks)?p.blocks:[]){const el=document.createElement('div');el.className='block '+(b.width==='half'?'half':'full')+' '+(b.type||'');if(b.type==='image'||b.type==='video'){if(b.content)el.appendChild(media(b.content,b.type,p.name))}else if(b.type==='gallery'){for(const url of safe(b.content).split(/\r?\n/).filter(Boolean))el.appendChild(media(url.trim(),'image',p.name))}else{el.textContent=b.content||''}blocks.appendChild(el)}
const moreRes=await fetch(config.url+'/rest/v1/projects?select=id,name,slug,cover_url,cover_type&published=eq.true&order=created_at.desc&limit=12',{headers:{apikey:config.anonKey}});
if(moreRes.ok){const other=(await moreRes.json()).filter(x=>x.id!==p.id).slice(0,2);if(other.length){document.getElementById('more').hidden=false;const grid=document.getElementById('moreGrid');for(const x of other){const a=document.createElement('a');a.className='more-card';a.href='../projects/?slug='+encodeURIComponent(x.slug);if(x.cover_url)a.appendChild(media(x.cover_url,x.cover_type,x.name));const label=document.createElement('strong');label.textContent=x.name;a.appendChild(label);grid.appendChild(a)}}}
}catch(e){console.error(e);status.textContent='Unable to load this project. Please try again later.'}
})();
</script></body></html>
